<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Materia Favorita</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4"
        th:text="${materiaFavorita != null and materiaFavorita.idFavorita != null ? 'Modificar Materia Favorita' : 'Nueva Materia Favorita'}"></h2>

    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/materiaFavorita/guardar}" th:object="${materiaFavorita}" method="post">
        <input type="hidden" th:field="*{idFavorita}"/>

        <div class="mb-3">
            <label class="form-label">Estudiante</label>
            <select th:field="*{estudiante}" class="form-control" required>
                <option value="">Seleccione un estudiante</option>
                <option th:each="e : ${estudiantes}"
                        th:value="${e.idEstudiante}"
                        th:text="${e.nombre + ' ' + e.apellidos}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Materia</label>
            <select th:field="*{materia}" class="form-control" required>
                <option value="">Seleccione una materia</option>
                <option th:each="m : ${materias}"
                        th:value="${m.idMateria}"
                        th:text="${m.nombre}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Prioridad</label>
            <select th:field="*{prioridad}" class="form-control" required>
                <option value="">Seleccione una prioridad</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Baja">Baja</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado</label>
            <select th:field="*{estado}" class="form-control">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/materiaFavorita/listado}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
