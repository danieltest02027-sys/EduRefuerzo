<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Formulario Chat</title>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="mb-4">Nuevo Chat</h2>

            <form th:action="@{/chat/guardar}" method="post">

                <div class="mb-3">
                    <label class="form-label">Usuario Origen</label>
                    <select name="idOrigen" class="form-control" required>
                        <option value="">Seleccione un estudiante</option>
                        <option th:each="estudiante : ${estudiantes}"
                                th:value="${estudiante.idEstudiante}"
                                th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Usuario Destino</label>
                    <select name="idDestino" class="form-control" required>
                        <option value="">Seleccione un estudiante</option>
                        <option th:each="estudiante : ${estudiantes}"
                                th:value="${estudiante.idEstudiante}"
                                th:text="${estudiante.nombre + ' ' + estudiante.apellidos}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mensaje Inicial</label>
                    <textarea name="contenidoInicial" class="form-control" rows="4" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-control">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/chat/listado}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </body>
</html>
