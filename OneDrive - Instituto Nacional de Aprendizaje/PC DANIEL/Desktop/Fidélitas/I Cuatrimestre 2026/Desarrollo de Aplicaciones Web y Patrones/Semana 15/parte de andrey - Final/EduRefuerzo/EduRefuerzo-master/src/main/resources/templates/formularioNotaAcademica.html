<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Formulario Nota Académica</title>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="mb-4"
                th:text="${notaAcademica != null and notaAcademica.idNota != null ? 'Modificar Nota Académica' : 'Nueva Nota Académica'}"></h2>

            <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/notaAcademica/guardar}" th:object="${notaAcademica}" method="post">
                <input type="hidden" th:field="*{idNota}"/>

                <div class="mb-3">
                    <label class="form-label">Estudiante</label>
                    <select th:field="*{estudiante}" class="form-control" required>
                        <option value="">Seleccione un estudiante</option>
                        <option th:each="e : ${estudiantes}"
                                th:value="${e.idEstudiante}"
                                th:text="${e.nombre + ' ' + e.apellidos}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Materia</label>
                    <select th:field="*{materia}" class="form-control" required>
                        <option value="">Seleccione una materia</option>
                        <option th:each="m : ${materias}"
                                th:value="${m.idMateria}"
                                th:text="${m.nombre}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input type="text" th:field="*{titulo}" class="form-control" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contenido</label>
                    <textarea th:field="*{contenido}" class="form-control" rows="5" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>
                    <select th:field="*{estado}" class="form-control">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/notaAcademica/listado}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </body>
</html>
