<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Listado de Notas Académicas</title>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="mb-4">Listado de Notas Académicas</h2>

            <div class="mb-3">
                <a th:href="@{/notaAcademica/nuevo}" class="btn btn-primary">Nueva Nota Académica</a>
            </div>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Materia</th>
                        <th>Título</th>
                        <th>Contenido</th>
                        <th>Fecha de Creación</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="n : ${notas}">
                        <td th:text="${n.idNota}"></td>
                        <td th:text="${n.estudiante != null ? n.estudiante.nombre : ''}"></td>
                        <td th:text="${n.materia != null ? n.materia.nombre : ''}"></td>
                        <td th:text="${n.titulo}"></td>
                        <td th:text="${n.contenido}"></td>
                        <td th:text="${n.fechaCreacion}"></td>
                        <td th:text="${n.estado}"></td>
                        <td>
                            <a th:href="@{/notaAcademica/modificar/{id}(id=${n.idNota})}" class="btn btn-warning btn-sm">Modificar</a>
                            <a th:href="@{/notaAcademica/eliminar/{id}(id=${n.idNota})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar esta nota académica?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <a href="/" class="btn btn-secondary">
                Volver al inicio
            </a>

        </div>
    </body>
</html>
