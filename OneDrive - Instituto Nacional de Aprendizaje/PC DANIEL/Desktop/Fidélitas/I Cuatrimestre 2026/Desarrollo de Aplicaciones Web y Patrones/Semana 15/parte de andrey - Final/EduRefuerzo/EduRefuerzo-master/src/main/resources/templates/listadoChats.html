<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Listado de Chats</title>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="mb-4">Listado de Chats</h2>

            <div class="mb-3">
                <a th:href="@{/chat/nuevo}" class="btn btn-primary">Nuevo Chat</a>
            </div>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID Chat</th>
                        <th>Usuario Origen</th>
                        <th>Usuario Destino</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="chat : ${chats}">
                        <td th:text="${chat.idChat}"></td>
                        <td th:text="${chat.usuarioOrigen != null ? chat.usuarioOrigen.nombre : ''}"></td>
                        <td th:text="${chat.usuarioDestino != null ? chat.usuarioDestino.nombre : ''}"></td>
                        <td th:text="${chat.fechaCreacion}"></td>
                        <td th:text="${chat.estado}"></td>
                        <td>
                            <a th:href="@{/chat/ver/{id}(id=${chat.idChat})}" class="btn btn-success btn-sm">Ver</a>
                            <a th:href="@{/chat/eliminar/{id}(id=${chat.idChat})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este chat?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <a href="/" class="btn btn-secondary">
                Volver al inicio
            </a>

        </div>
    </body>
</html>
