<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Listado de Horarios</title>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="mb-4">Listado de Horarios de Estudio</h2>

            <div class="mb-3">
                <a th:href="@{/horario/nuevo}" class="btn btn-primary">Nuevo Horario</a>
            </div>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Materia</th>
                        <th>Fecha</th>
                        <th>Hora Inicio</th>
                        <th>Hora Fin</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h : ${horarios}">
                        <td th:text="${h.idHorario}"></td>
                        <td th:text="${h.estudiante != null ? h.estudiante.nombre : ''}"></td>
                        <td th:text="${h.materia != null ? h.materia.nombre : ''}"></td>
                        <td th:text="${h.fecha}"></td>
                        <td th:text="${h.horaInicio}"></td>
                        <td th:text="${h.horaFin}"></td>
                        <td th:text="${h.descripcion}"></td>
                        <td th:text="${h.estado}"></td>
                        <td>
                            <a th:href="@{/horario/modificar/{id}(id=${h.idHorario})}" class="btn btn-warning btn-sm">Modificar</a>
                            <a th:href="@{/horario/eliminar/{id}(id=${h.idHorario})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar este horario?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <a href="/" class="btn btn-secondary">
                Volver al inicio
            </a>

        </div>
    </body>
</html>
