<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Listado de Materias Favoritas</title>
        <meta charset="UTF-8"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-4">
            <h2 class="mb-4">Listado de Materias Favoritas</h2>

            <div class="mb-3">
                <a th:href="@{/materiaFavorita/nuevo}" class="btn btn-primary">Nueva Materia Favorita</a>
            </div>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Materia</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mf : ${materiasFavoritas}">
                        <td th:text="${mf.idFavorita}"></td>
                        <td th:text="${mf.estudiante != null ? mf.estudiante.nombre : ''}"></td>
                        <td th:text="${mf.materia != null ? mf.materia.nombre : ''}"></td>
                        <td th:text="${mf.prioridad}"></td>
                        <td th:text="${mf.estado}"></td>
                        <td>
                            <a th:href="@{/materiaFavorita/modificar/{id}(id=${mf.idFavorita})}" class="btn btn-warning btn-sm">Modificar</a>
                            <a th:href="@{/materiaFavorita/eliminar/{id}(id=${mf.idFavorita})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Desea eliminar esta materia favorita?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <a href="/" class="btn btn-secondary">
                Volver al inicio
            </a>

        </div>
    </body>
</html>
